name: Notificar revisores

on:
  pull_request:
    types: [opened, review_requested]

permissions:
  pull-requests: write
  issues: write

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - name: Comentar no Pull Request
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const autor = pr.user.login;
            let mensagem = null;

            if (context.payload.action === 'review_requested' && context.payload.requested_reviewer) {
              const revisor = context.payload.requested_reviewer.login;
              mensagem = `👋 @${revisor}, @${autor} pediu a tua revisão neste Pull Request.`;
            } else if (context.payload.action === 'opened' && pr.requested_reviewers.length === 0) {
              mensagem = `⚠️ @${autor}, este Pull Request ainda não tem revisor. Escolhe uma colega em "Reviewers".`;
            }

            if (mensagem) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: mensagem
              });
            }
